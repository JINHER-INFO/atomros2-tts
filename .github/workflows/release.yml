name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: install patchelf
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends patchelf

      - name: build and package
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomros2-tts_linux_${{ matrix.arch }}
          path: dist/atomros2-tts_linux_${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: list assets
        run: find dist -type f

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/atomros2-tts_linux_*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
